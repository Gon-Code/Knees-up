name: Godot Testing

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: croconut/godot-tester@v5.2
      with:
        # required
        version: "4.4.1"
        # custom download
        custom-godot-dl-url: "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip"
        custom-godot-binary-path: "Godot_v4.4.1-stable_linux.x86_64"
        path: "."
        test-dir: "res://test"
        import-time: "5"
        test-timeout: "45"
        minimum-pass: "1.0"
