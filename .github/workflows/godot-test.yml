name: Godot Testing

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: croconut/godot-tester@v5.2
      with:
        version: "4.4.4"
        path: "."
        test-dir: "res://test"
        import-time: "5"
        test-timeout: "45"
        minimum-pass: "1.0"