name: Build and Release Windows Executable

on:
  schedule:
    - cron: '0 15 * * *'
  push:
    branches:
      - '**'

jobs:
  build-windows:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - uses: chickensoft-games/setup-godot@v2
      name: 🤖 Setup Godot
      with:
        version: 4.5.0
        include-templates: true

    - name: Export for Windows
      run: |
        # Godot exporta el .exe y, si es PCK embebido, el pck dentro del exe.
        godot --headless --export-release "Windows Desktop" "builds/windows/Knees-up.exe"

    - name: Copiar GDExtension DLL si existe
      run: |
        mkdir -p builds/windows
        if [ -f addons/godot-sdl-gyro/libsdlgyro.windows.template_release.x86_64.dll ]; then
          cp addons/godot-sdl-gyro/libsdlgyro.windows.template_release.x86_64.dll builds/windows/
          echo "DLL copiado correctamente."
        else
          echo "No se encontró el DLL, se omite la copia."
        fi

    - name: Archive Windows build
      run: zip -r Knees-up-windows.zip builds/windows/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: Knees-up-windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}