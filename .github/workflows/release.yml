name: Build and Release Windows Executable

on:
  push:
    branches:
      - master

jobs:
  build-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 🐙 Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: chickensoft-games/setup-godot@v2
      name: 🤖 Setup Godot
      with:
        version: 4.5.0
        include-templates: true

    - name: 🛠️ Crear directorios de build
      run: mkdir -p builds/windows

    - name: 🚀 Exportar Build de Windows
      run: |
        # Este es el comando que te faltaba.
        # Lee tu 'export_presets.cfg' y crea los archivos en 'builds/windows'.
        godot --headless --export-release "Windows Desktop" builds/windows/knees-up.exe

    - name: 📚 Archive Windows build
      run: |
        # Este paso ahora funcionará, porque el paso anterior creó los archivos.
        cd builds/windows
        # Corregido para comprimir solo los archivos necesarios
        zip -r ../../Knees-up-windows.zip knees-up.exe libsdlgyro.windows.template_release.x86_64.dll
        cd ../..
    
    - name: 🏷️ Generate and Push Git Tag
      id: generate_tag
      run: |
        # Usar 'git fetch --tags' para asegurar que los tags están disponibles localmente
        git fetch --tags
        
        COUNT=$(git tag -l "v1.0.*" | wc -l)

        NEXT_PATCH=$((COUNT + 1))
        NEW_TAG="v1.0.${NEXT_PATCH}"

        echo "Generando nuevo tag: $NEW_TAG"
        
        # Primero intentamos crear el tag localmente
        if ! git tag $NEW_TAG; then
          # Si falla localmente, es que ya existe (p.ej. de un run anterior fallido)
          echo "Advertencia: El tag $NEW_TAG ya existe localmente."
          RUN_NUMBER=${{ github.run_number }}
          NEW_TAG="v1.0.${COUNT}_run${RUN_NUMBER}" # Hacemos un tag único
          echo "Creando tag de fallback: $NEW_TAG"
          git tag $NEW_TAG
        fi

        # Ahora intentamos subir el tag (sea el original o el de fallback)
        if git push origin $NEW_TAG 2>/dev/null; then
          echo "Tag $NEW_TAG subido exitosamente."
        else
          echo "Advertencia: El tag $NEW_TAG ya existe en el repositorio remoto."
          # Si incluso el de fallback falla (muy improbable), usamos el hash de commit
          COMMIT_HASH=$(git rev-parse --short HEAD)
          NEW_TAG="v1.0.${COUNT}_${COMMIT_HASH}"
          echo "Creando tag de emergencia: $NEW_TAG"
          git tag $NEW_TAG
          git push origin $NEW_TAG
        fi

        echo "tag_name=$NEW_TAG" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: knees-up-windows.zip
        tag_name: ${{ steps.generate_tag.outputs.tag_name }} 
        name: ${{ steps.generate_tag.outputs.tag_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
