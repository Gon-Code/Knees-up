name: Run Godot Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  godot-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Godot
        uses: firebelley/setup-godot@v1.3
        with:
          version: 4.4.4
          headless: true

      - name: Run Godot tests
        run: godot --headless --path . --run-tests
